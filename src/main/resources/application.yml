server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  application:
    name: StudentManagementSystem
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/studentmanagement?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
  cache:
    redis:
      time-to-live: 10m
    type: REDIS

  flyway:
    baseline-on-migrate: true
  jpa:
#    admin:
#      enabled: true
#      path: /admin-panel
#      security:
#        enabled: true
##        username: admin
##        password: "${ADMIN_PASSWORD}"
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    root: INFO

    com:
      renish:
        backend: DEBUG

    org:
      springframework:
        data:
          redis: DEBUG
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

    io:
      lettuce:
        core: DEBUG

management:
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: NEVER
  info:
    env:
      enabled: true
info:
  app:
    name: Student Management System
    description: Spring Boot Student Management REST API
    version: 1.0.0







app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
    refresh:
      expiration-days: ${JWT_REFRESH_EXPIRATION}
  file:
    upload-dir: uploads

springdoc:
  swagger-ui:
    tagsSorter: alpha
    operationsSorter: alpha

kraftadmin:
  enabled: true
